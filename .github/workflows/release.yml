name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GesCon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: packaging/launcher/go.mod

      # A interface do GesCon é web (PO-UI, `advplc serve`): o pacote leva o
      # advplc da release do AdvPP fixada em ADVPP_VERSION (pacote advpp-cli),
      # os fontes e o iniciador (packaging/launcher), que sobe o servidor em
      # 127.0.0.1 e abre o navegador. O instalador Windows é NSIS, por usuário.
      - name: Ferramentas de empacotamento
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      - name: Testa o iniciador
        run: cd packaging/launcher && go vet ./... && go test ./...

      - name: Monta os pacotes
        run: packaging/build-package.sh "${GITHUB_REF_NAME#v}"

      - name: Publica no release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/*
          generate_release_notes: true
