name: Release GesConApp

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            name: GesConApp-linux
            flags: ''

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout GesCon
        uses: actions/checkout@v4

      - name: Checkout AdvPP
        uses: actions/checkout@v4
        with:
          repository: peder1981/AdvPP
          path: advpp

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxi-dev \
            libxxf86vm-dev \
            libgl1-mesa-dev \
            pkg-config

      - name: Build AdvPP compiler
        run: |
          cd advpp
          go build -o advplc ./cmd/advplc
          ./advplc version

      - name: Bootstrap database schema
        run: |
          mkdir -p ~/.advpp
          sqlite3 ~/.advpp/ADVPP.db < schema.sql
        working-directory: .

      - name: Build desktop app
        env:
          ADVPP_SRC: ${{ github.workspace }}/advpp
        run: ${{ github.workspace }}/advpp/advplc build gescon.prw -o ${{ matrix.name }}

      - name: Verify binary
        run: |
          ls -lh ${{ matrix.name }}
          file ${{ matrix.name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
