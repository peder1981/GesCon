name: Unit Tests

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build and install advplc
        run: |
          git clone --depth 1 https://github.com/peder1981/AdvPP.git /tmp/advpp
          cd /tmp/advpp
          go build -o /tmp/advplc ./cmd/advplc
          echo "/tmp" >> $GITHUB_PATH

      - name: Verify advplc
        run: /tmp/advplc version

      - name: Run unit tests
        run: |
          for test in tests/*_test.prw; do
            echo "=== $(basename $test) ==="
            /tmp/advplc run "$test" || exit 1
          done
