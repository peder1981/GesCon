name: Unit Tests

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download advplc binary
        run: |
          mkdir -p /tmp/advpp
          cd /tmp/advpp
          # Download latest AdvPP release with advplc binary
          curl -L https://github.com/peder1981/AdvPP/releases/download/v1.24.0/advplc-linux-amd64 \
            -o advplc 2>/dev/null || \
            curl -L https://github.com/peder1981/AdvPP/releases/latest/download/advplc-linux-amd64 \
            -o advplc
          chmod +x advplc
          echo "/tmp/advpp" >> $GITHUB_PATH

      - name: Verify advplc
        run: advplc version

      - name: Run unit tests
        run: |
          for test in tests/*_test.prw; do
            echo "=== $(basename $test) ==="
            advplc run "$test" || exit 1
          done
