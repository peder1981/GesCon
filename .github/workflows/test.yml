name: Lint

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/test.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AdvPL/TLPP source files exist
        run: |
          test -f gescon.prw || exit 1
          test -d src && [ $(find src -name "*.prw" | wc -l) -ge 10 ] || exit 1
          test -d tests && [ $(find tests -name "*_test.prw" | wc -l) -ge 5 ] || exit 1
          echo "✓ Source structure valid"

      - name: Check syntax (basic file validation)
        run: |
          for f in src/*.prw tests/*_test.prw gescon.prw; do
            [ -f "$f" ] || continue
            # Check for basic AdvPL/TLPP structure
            grep -q "^Function\|^User Function\|^method\|^class" "$f" || [ $(wc -l < "$f") -gt 5 ] || exit 1
            echo "  ✓ $f"
          done
          echo "✓ All files have content"

      - name: Check database schema
        run: |
          test -f schema.sql || exit 1
          grep -q "CREATE TABLE" schema.sql || exit 1
          echo "✓ Schema file valid"
