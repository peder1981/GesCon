name: Build

on:
  push:
    branches: [master]
    paths:
      - '**.prw'
      - 'schema.sql'
      - 'scripts/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**.prw'
      - 'schema.sql'
      - 'scripts/**'
      - '.github/workflows/test.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADVPP_SRC: ${{ github.workspace }}/AdvPP
      ADVPP_DB: ${{ github.workspace }}/ci.db
    steps:
      - name: Checkout GesCon
        uses: actions/checkout@v4
        with:
          path: GesCon

      # O GesCon compila com o AdvPP, um compilador AdvPL/TLPP em Go que
      # vive em outro repositorio. Sem ele nao ha como validar sintaxe nem
      # gerar o executavel -- o lint por grep que existia aqui antes nao
      # compilava nada, e deixava passar erro de sintaxe.
      - name: Checkout AdvPP (compilador)
        uses: actions/checkout@v4
        with:
          repository: peder1981/AdvPP
          path: AdvPP

      - uses: actions/setup-go@v5
        with:
          go-version-file: AdvPP/go.mod
          cache-dependency-path: AdvPP/go.sum

      - name: Build advplc
        run: |
          mkdir -p "$HOME/.local/bin"
          cd AdvPP
          go build -o "$HOME/.local/bin/advplc" ./cmd/advplc
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap do banco
        run: |
          cd GesCon
          sqlite3 "$ADVPP_DB" < schema.sql

      - name: Sintaxe de todos os fontes
        run: GesCon/scripts/check.sh

      - name: Suite de testes
        run: GesCon/scripts/test.sh

      - name: Executavel desktop
        run: GesCon/scripts/build.sh -o /tmp/GesConApp
